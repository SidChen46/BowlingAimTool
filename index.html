<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>保齡球幾何瞄準計算器</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="球道瞄準">
  <meta name="theme-color" content="#0f172a">

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ccircle cx='50' cy='50' r='32' fill='%23ef4444'/%3E%3Ccircle cx='42' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='58' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='56' r='4' fill='%23ffffff'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .app-wrapper {
      width: 100%;
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 10px) + 4px) 12px calc(env(safe-area-inset-bottom, 8px) + 4px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .top-bar h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .hand-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid #334155;
    }

    .toggle-btn {
      padding: 4px 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    /* 緊湊型結果卡片，留更多高度給擬真球道 */
    .result-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .result-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .result-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .laydown-badge {
      font-size: 0.75rem;
      color: #10b981;
      font-weight: 600;
    }

    .target-desc {
      font-size: 0.84rem;
      color: #e2e8f0;
      font-weight: 600;
      margin-top: 2px;
    }

    .target-board {
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    /* 緊湊型 2x2 滑桿網格，大幅釋放垂直空間給球道 */
    .controls {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 500;
    }

    .val-badge {
      color: var(--primary);
      font-weight: 700;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dir-hint {
      font-size: 0.62rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2.5px solid var(--primary);
      cursor: pointer;
    }

    /* 球道顯示區：佔滿所有剩餘螢幕高度 */
    .canvas-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 6px 10px 8px;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      flex: 1;
      min-height: 220px;
      overflow: hidden;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .scale-btns {
      display: flex;
      gap: 3px;
      background: #0f172a;
      padding: 2px;
      border-radius: 6px;
    }

    .scale-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.66rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .scale-btn.active {
      background: #334155;
      color: #f8fafc;
      font-weight: 600;
    }

    .svg-box {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    svg {
      height: 100%;
      display: block;
      transition: width 0.25s ease;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="top-bar">
      <h1>保齡球瞄準計算器</h1>
      <div class="hand-toggle">
        <button class="toggle-btn active" id="btnRight" onclick="setHand('R')">右手 (右1板)</button>
        <button class="toggle-btn" id="btnLeft" onclick="setHand('L')">左手 (左1板)</button>
      </div>
    </div>

    <div class="result-card">
      <div class="result-left">
        <div class="result-label">目標箭頭 (15呎處) · <span class="laydown-badge" id="laydownInfo">落球 20.0 板</span></div>
        <div class="target-desc" id="targetDesc">第 3 箭頭 (15板) 往左 0.5 板</div>
      </div>
      <div class="target-board" id="targetBoard">15.5</div>
    </div>

    <!-- 2x2 緊湊滑桿，把最大高度讓給下方 60 呎球道 -->
    <div class="controls">
      <div class="control-item">
        <div class="control-header">
          <span>滑步站點</span>
          <span class="val-badge" id="stanceVal">25.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="stanceLeftHint">左39</span>
          <input type="range" id="stanceSlider" min="1" max="39" step="0.5" value="15" oninput="updateFromSliders()">
          <span class="dir-hint" id="stanceRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點板位</span>
          <span class="val-badge" id="bpBoardVal">8.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="bpLeftHint">左39</span>
          <input type="range" id="bpSlider" min="1" max="39" step="0.5" value="32" oninput="updateFromSliders()">
          <span class="dir-hint" id="bpRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>落球內縮偏移</span>
          <span class="val-badge" id="offsetVal">5.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">0</span>
          <input type="range" id="offsetSlider" min="0" max="12" step="0.5" value="5" oninput="updateFromSliders()">
          <span class="dir-hint">12</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點距離</span>
          <span class="val-badge" id="bpDistVal">40 呎</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">35</span>
          <input type="range" id="bpDistSlider" min="35" max="46" step="1" value="40" oninput="updateFromSliders()">
          <span class="dir-hint">46呎</span>
        </div>
      </div>
    </div>

    <div class="canvas-card">
      <div class="canvas-header">
        <span id="laneLeftLabel">◀ 左39</span>
        <div class="scale-btns">
          <button class="scale-btn active" id="scaleFit" onclick="setScale('fit')">實戰寬版</button>
          <button class="scale-btn" id="scaleSlim" onclick="setScale('slim')">擬真修長</button>
          <button class="scale-btn" id="scaleTrue" onclick="setScale('true')">1:1真實(極窄)</button>
        </div>
        <span id="laneRightLabel">右1 ▶</span>
      </div>
      <div class="svg-box">
        <svg id="laneSvg" viewBox="0 0 260 660" preserveAspectRatio="none" style="width: 100%;"></svg>
      </div>
    </div>
  </div>

  <script>
    let currentHand = 'R';
    let stanceBoard = 25;
    let bpBoard = 8;
    let currentScale = 'fit';

    function sliderToBoard(val) {
      return currentHand === 'R' ? (40 - val) : val;
    }
    function boardToSlider(board) {
      return currentHand === 'R' ? (40 - board) : board;
    }

    function setScale(mode) {
      currentScale = mode;
      document.getElementById('scaleFit').classList.toggle('active', mode === 'fit');
      document.getElementById('scaleSlim').classList.toggle('active', mode === 'slim');
      document.getElementById('scaleTrue').classList.toggle('active', mode === 'true');

      const svg = document.getElementById('laneSvg');
      if (mode === 'fit') {
        svg.style.width = '100%';
        svg.setAttribute('preserveAspectRatio', 'none');
      } else if (mode === 'slim') {
        svg.style.width = '52%';
        svg.setAttribute('preserveAspectRatio', 'none');
      } else {
        // 真實 60 呎 x 3.46 呎 (17.3:1 長寬比)
        svg.style.width = '16%';
        svg.setAttribute('preserveAspectRatio', 'none');
      }
      render();
    }

    function setHand(hand) {
      currentHand = hand;
      document.getElementById('btnRight').classList.toggle('active', hand === 'R');
      document.getElementById('btnLeft').classList.toggle('active', hand === 'L');

      if (hand === 'R') {
        document.getElementById('stanceLeftHint').innerText = '左39';
        document.getElementById('stanceRightHint').innerText = '右1';
        document.getElementById('bpLeftHint').innerText = '左39';
        document.getElementById('bpRightHint').innerText = '右1';
        document.getElementById('laneLeftLabel').innerText = '◀ 左39';
        document.getElementById('laneRightLabel').innerText = '右1 ▶';
      } else {
        document.getElementById('stanceLeftHint').innerText = '左1';
        document.getElementById('stanceRightHint').innerText = '右39';
        document.getElementById('bpLeftHint').innerText = '左1';
        document.getElementById('bpRightHint').innerText = '右39';
        document.getElementById('laneLeftLabel').innerText = '◀ 左1';
        document.getElementById('laneRightLabel').innerText = '右39 ▶';
      }

      document.getElementById('stanceSlider').value = boardToSlider(stanceBoard);
      document.getElementById('bpSlider').value = boardToSlider(bpBoard);
      render();
    }

    function updateFromSliders() {
      const sVal = parseFloat(document.getElementById('stanceSlider').value);
      const bVal = parseFloat(document.getElementById('bpSlider').value);
      stanceBoard = sliderToBoard(sVal);
      bpBoard = sliderToBoard(bVal);
      render();
    }

    // 球道繪製座標：X 範圍 30 ~ 230 (寬 200 對應 39 塊板)
    function boardToX(board) {
      const leftEdge = 30;
      const laneW = 200;
      if (currentHand === 'R') {
        return leftEdge + ((39 - board) / 38) * laneW;
      } else {
        return leftEdge + ((board - 1) / 38) * laneW;
      }
    }

    // Y 座標換算：0 呎犯規線在 Y=620，60 呎 1號瓶在 Y=45 (完整等比例對應 0~60 呎)
    function ftToY(ft) {
      const yFoul = 620;
      const y60 = 45;
      return yFoul - (ft / 60) * (yFoul - y60);
    }

    function render() {
      const offset = parseFloat(document.getElementById('offsetSlider').value);
      const bpDist = parseFloat(document.getElementById('bpDistSlider').value);

      document.getElementById('stanceVal').innerText = stanceBoard.toFixed(1) + ' 板';
      document.getElementById('offsetVal').innerText = offset.toFixed(1) + ' 板';
      document.getElementById('bpBoardVal').innerText = bpBoard.toFixed(1) + ' 板';
      document.getElementById('bpDistVal').innerText = bpDist + ' 呎';

      const laydown = Math.max(1, Math.min(39, stanceBoard - offset));
      document.getElementById('laydownInfo').innerText = '落球 ' + laydown.toFixed(1) + ' 板';

      const targetArrow = laydown + (15 / bpDist) * (bpBoard - laydown);
      document.getElementById('targetBoard').innerText = targetArrow.toFixed(1);

      let closestArrow = Math.round(targetArrow / 5);
      closestArrow = Math.max(1, Math.min(7, closestArrow));
      const refBoard = closestArrow * 5;
      const diff = targetArrow - refBoard;

      let desc = '第 ' + closestArrow + ' 箭頭 (' + refBoard + '板)';
      if (Math.abs(diff) >= 0.2) {
        if (currentHand === 'R') {
          desc += diff > 0 ? ' 往左 ' + Math.abs(diff).toFixed(1) + ' 板' : ' 往右 ' + Math.abs(diff).toFixed(1) + ' 板';
        } else {
          desc += diff > 0 ? ' 往右 ' + Math.abs(diff).toFixed(1) + ' 板' : ' 往左 ' + Math.abs(diff).toFixed(1) + ' 板';
        }
      } else {
        desc += ' 正中央';
      }
      document.getElementById('targetDesc').innerText = desc;

      drawRealisticLane(stanceBoard, laydown, targetArrow, bpBoard, bpDist);
    }

    function drawRealisticLane(stance, laydown, arrow, bp, bpDist) {
      const svg = document.getElementById('laneSvg');
      const yFoul = ftToY(0);
      const yTop = ftToY(63);
      const yBp = ftToY(bpDist);

      let html = '';

      // 1. 兩側水溝 (Gutters) 與楓木球道底色
      html += `<rect x="18" y="${yTop}" width="12" height="${yFoul - yTop + 30}" fill="#111827" />`;
      html += `<rect x="230" y="${yTop}" width="12" height="${yFoul - yTop + 30}" fill="#111827" />`;
      html += `<rect x="30" y="${yTop}" width="200" height="${yFoul - yTop}" fill="#2b2116" />`;
      // 助走道 (Approach 0呎以下)
      html += `<rect x="30" y="${yFoul}" width="200" height="35" fill="#231a11" />`;

      // 2. 藍色上油區視覺層 (0 呎 ~ 轉折點距離)
      html += `<rect x="30" y="${yBp}" width="200" height="${yFoul - yBp}" fill="rgba(56, 189, 248, 0.08)" />`;
      html += `<line x1="30" y1="${yBp}" x2="230" y2="${yBp}" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-dasharray="4,4" />`;

      // 3. 繪製全部 39 塊板的細線與每 5 板重點線
      for (let b = 1; b <= 39; b++) {
        const x = boardToX(b);
        if (b % 5 === 0) {
          const isCenter = (b === 20);
          html += `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${yFoul + 30}" stroke="${isCenter ? '#785a37' : '#4a3723'}" stroke-width="${isCenter ? 2 : 1.2}" />`;
          if (currentScale !== 'true') {
            html += `<text x="${x}" y="648" fill="#94a3b8" font-size="11" text-anchor="middle">${b}</text>`;
          }
        } else if (currentScale === 'fit') {
          html += `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${yFoul}" stroke="#332619" stroke-width="0.5" />`;
        }
      }

      // 4. 左側真實距離尺標 (0ft, 15ft, 30ft, 40ft, 60ft)
      if (currentScale !== 'true') {
        const marks = [0, 15, 30, 40, 60];
        marks.forEach(ft => {
          const y = ftToY(ft);
          html += `<text x="15" y="${y + 4}" fill="#64748b" font-size="9" text-anchor="end">${ft}'</text>`;
        });
      }

      // 5. 真實球道地標：7 呎與 12 呎定位圓點 (Range Finder Dots)
      [5, 8, 11, 14, 20, 26, 29, 32, 35].forEach(b => {
        html += `<circle cx="${boardToX(b)}" cy="${ftToY(7)}" r="1.8" fill="#64748b" />`;
      });
      [3, 5, 8, 11, 14, 26, 29, 32, 35, 37].forEach(b => {
        html += `<circle cx="${boardToX(b)}" cy="${ftToY(12)}" r="2" fill="#94a3b8" />`;
      });

      // 6. 真實 15 呎 V 字排列目標箭頭 (Chevron Arrows: 20板在16呎，5/35板在15呎)
      for (let b = 5; b <= 35; b += 5) {
        const ax = boardToX(b);
        const arrowFt = 16 - (Math.abs(20 - b) / 15) * 1.2; // V字高度差
        const ay = ftToY(arrowFt);
        const active = Math.abs(b - arrow) <= 2.5;
        const fill = active ? '#38bdf8' : '#94a3b8';
        html += `<polygon points="${ax},${ay - 9} ${ax - 4},${ay + 5} ${ax + 4},${ay + 5}" fill="${fill}" />`;
      }

      // 7. 遠端 34~35 呎與 40~43 呎導引線 (Downlane Markers / Tracers)
      [10, 15, 20, 25, 30].forEach(b => {
        const mx = boardToX(b);
        html += `<line x1="${mx}" y1="${ftToY(35)}" x2="${mx}" y2="${ftToY(34)}" stroke="#64748b" stroke-width="2" />`;
        html += `<line x1="${mx}" y1="${ftToY(43)}" x2="${mx}" y2="${ftToY(40)}" stroke="#94a3b8" stroke-width="2" />`;
      });

      // 8. 頂部 60 呎 10 顆球瓶真實板位排列
      // 第1排(60ft): 20板 | 第2排(61ft): 15, 25板 | 第3排(62ft): 10, 20, 30板 | 第4排(63ft): 5, 15, 25, 35板
      const pins = [
        { b: 20, ft: 60 },
        { b: 15, ft: 61 }, { b: 25, ft: 61 },
        { b: 10, ft: 62 }, { b: 20, ft: 62 }, { b: 30, ft: 62 },
        { b: 5, ft: 63 },  { b: 15, ft: 63 }, { b: 25, ft: 63 }, { b: 35, ft: 63 }
      ];
      pins.forEach((p, idx) => {
        const px = boardToX(p.b);
        const py = ftToY(p.ft);
        const isHeadPin = (idx === 0);
        html += `<circle cx="${px}" cy="${py}" r="4.5" fill="#f8fafc" stroke="${isHeadPin ? '#ef4444' : '#64748b'}" stroke-width="1.5" />`;
      });

      // 9. 犯規線 (0 呎)
      html += `<line x1="30" y1="${yFoul}" x2="230" y2="${yFoul}" stroke="#ef4444" stroke-width="2" />`;

      // 10. 繪製球的軌跡：落球(0呎) -> 箭頭(15呎) -> 轉折點(bpDist) -> 1-3/1-2 Pocket (60呎 17.5板)
      const xStance = boardToX(stance);
      const xLaydown = boardToX(laydown);
      const xArrow = boardToX(arrow);
      const xBp = boardToX(bp);
      const xPocket = boardToX(17.5);
      const yArrow = ftToY(15);
      const yPocket = ftToY(60);

      // 滑步腳與落球偏移連線
      html += `<line x1="${xStance}" y1="${yFoul}" x2="${xLaydown}" y2="${yFoul}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,3" />`;
      html += `<circle cx="${xStance}" cy="${yFoul}" r="5" fill="#231a11" stroke="#94a3b8" stroke-width="2" />`;

      // 前中段直線推進軌跡 (Skid / Roll phase)
      html += `<polyline points="${xLaydown},${yFoul} ${xArrow},${yArrow} ${xBp},${yBp}" fill="none" stroke="#f59e0b" stroke-width="3.5" />`;

      // 後段轉折進 Pocket (Hook phase 二次貝茲平滑曲線)
      const ctrlY = (yBp + yPocket) / 2;
      html += `<path d="M ${xBp} ${yBp} Q ${xBp} ${ctrlY} ${xPocket} ${yPocket}" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,3" />`;

      // 節點與清晰文字標籤
      html += `<circle cx="${xLaydown}" cy="${yFoul}" r="5.5" fill="#10b981" />`;
      html += `<circle cx="${xArrow}" cy="${yArrow}" r="5.5" fill="#38bdf8" />`;
      html += `<circle cx="${xBp}" cy="${yBp}" r="5.5" fill="#ef4444" />`;

      if (currentScale !== 'true') {
        const alignLeft = currentHand === 'R';
        function labelTag(x, y, text, color, toLeft) {
          const tx = toLeft ? (x - 9) : (x + 9);
          const anchor = toLeft ? 'end' : 'start';
          return `<text x="${tx}" y="${y + 4}" fill="${color}" font-size="12" font-weight="bold" text-anchor="${anchor}">${text}</text>`;
        }
        html += labelTag(xLaydown, yFoul - 8, `${laydown.toFixed(1)}板`, '#10b981', !alignLeft);
        html += labelTag(xArrow, yArrow, `瞄${arrow.toFixed(1)}`, '#38bdf8', alignLeft);
        html += labelTag(xBp, yBp, `折${bp.toFixed(1)} (${bpDist}')`, '#f87171', alignLeft);
      }

      svg.innerHTML = html;
    }

    render();
  </script>
</body>
</html>
