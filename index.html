<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>保齡球幾何瞄準計算器</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="球道瞄準">
  <meta name="theme-color" content="#0f172a">

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ccircle cx='50' cy='50' r='32' fill='%23ef4444'/%3E%3Ccircle cx='42' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='58' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='56' r='4' fill='%23ffffff'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    .app-wrapper {
      width: 100%;
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 12px) + 6px) 14px calc(env(safe-area-inset-bottom, 10px) + 6px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .hand-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid #334155;
    }

    .toggle-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    .result-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .laydown-badge {
      color: #10b981;
      font-weight: 600;
    }

    .target-board {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.05;
      margin: 2px 0;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .target-desc {
      font-size: 0.88rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    .controls {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .val-badge {
      color: var(--primary);
      font-weight: 700;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dir-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f8fafc;
      border: 3px solid var(--primary);
      cursor: pointer;
    }

    .canvas-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      flex: 1;
      min-height: 140px;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .svg-box {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #18130d;
      border-radius: 8px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="top-bar">
      <h1>保齡球瞄準計算器</h1>
      <div class="hand-toggle">
        <button class="toggle-btn active" id="btnRight" onclick="setHand('R')">右手 (右1板)</button>
        <button class="toggle-btn" id="btnLeft" onclick="setHand('L')">左手 (左1板)</button>
      </div>
    </div>

    <div class="result-card">
      <div class="result-header">
        <span>目標箭頭 (15呎)</span>
        <span class="laydown-badge" id="laydownInfo">實際落球：20.0 板</span>
      </div>
      <div class="target-board" id="targetBoard">15.5</div>
      <div class="target-desc" id="targetDesc">第 3 箭頭 (15板) 往左 0.5 板</div>
    </div>

    <div class="controls">
      <!-- 滑步站點：右手時左邊=39，右邊=1，使用視覺位置 pos (1~39) 換算 -->
      <div class="control-item">
        <div class="control-header">
          <span>滑步站點 (Stance)</span>
          <span class="val-badge" id="stanceVal">25.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="stanceLeftHint">左39</span>
          <input type="range" id="stanceSlider" min="1" max="39" step="0.5" value="15" oninput="updateFromSliders()">
          <span class="dir-hint" id="stanceRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>落球內縮偏移 (Offset)</span>
          <span class="val-badge" id="offsetVal">5.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">0</span>
          <input type="range" id="offsetSlider" min="0" max="12" step="0.5" value="5" oninput="updateFromSliders()">
          <span class="dir-hint">12</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點板位 (Break Point)</span>
          <span class="val-badge" id="bpBoardVal">8.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="bpLeftHint">左39</span>
          <input type="range" id="bpSlider" min="1" max="39" step="0.5" value="32" oninput="updateFromSliders()">
          <span class="dir-hint" id="bpRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點距離 (BP Distance)</span>
          <span class="val-badge" id="bpDistVal">40 呎</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">35呎</span>
          <input type="range" id="bpDistSlider" min="35" max="46" step="1" value="40" oninput="updateFromSliders()">
          <span class="dir-hint">46呎</span>
        </div>
      </div>
    </div>

    <div class="canvas-card">
      <div class="canvas-header">
        <span id="laneLeftLabel">◀ 左側溝 (39板)</span>
        <span>球道俯視軌跡</span>
        <span id="laneRightLabel">右側溝 (1板) ▶</span>
      </div>
      <div class="svg-box">
        <svg id="laneSvg" viewBox="0 0 360 200" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <script>
    let currentHand = 'R';
    let stanceBoard = 25;
    let bpBoard = 8;

    // 滑桿數值(左1~右39) 與 實際板位 的雙向轉換
    function sliderToBoard(val) {
      return currentHand === 'R' ? (40 - val) : val;
    }
    function boardToSlider(board) {
      return currentHand === 'R' ? (40 - board) : board;
    }

    function setHand(hand) {
      currentHand = hand;
      document.getElementById('btnRight').classList.toggle('active', hand === 'R');
      document.getElementById('btnLeft').classList.toggle('active', hand === 'L');

      if (hand === 'R') {
        document.getElementById('stanceLeftHint').innerText = '左39';
        document.getElementById('stanceRightHint').innerText = '右1';
        document.getElementById('bpLeftHint').innerText = '左39';
        document.getElementById('bpRightHint').innerText = '右1';
        document.getElementById('laneLeftLabel').innerText = '◀ 左側溝 (39板)';
        document.getElementById('laneRightLabel').innerText = '右側溝 (1板) ▶';
      } else {
        document.getElementById('stanceLeftHint').innerText = '左1';
        document.getElementById('stanceRightHint').innerText = '右39';
        document.getElementById('bpLeftHint').innerText = '左1';
        document.getElementById('bpRightHint').innerText = '右39';
        document.getElementById('laneLeftLabel').innerText = '◀ 左側溝 (1板)';
        document.getElementById('laneRightLabel').innerText = '右側溝 (39板) ▶';
      }

      document.getElementById('stanceSlider').value = boardToSlider(stanceBoard);
      document.getElementById('bpSlider').value = boardToSlider(bpBoard);
      render();
    }

    function updateFromSliders() {
      const sVal = parseFloat(document.getElementById('stanceSlider').value);
      const bVal = parseFloat(document.getElementById('bpSlider').value);
      stanceBoard = sliderToBoard(sVal);
      bpBoard = sliderToBoard(bVal);
      render();
    }

    function boardToX(board) {
      const pad = 20;
      const usableW = 360 - pad * 2;
      if (currentHand === 'R') {
        return pad + ((39 - board) / 38) * usableW;
      } else {
        return pad + ((board - 1) / 38) * usableW;
      }
    }

    function render() {
      const offset = parseFloat(document.getElementById('offsetSlider').value);
      const bpDist = parseFloat(document.getElementById('bpDistSlider').value);

      document.getElementById('stanceVal').innerText = stanceBoard.toFixed(1) + ' 板';
      document.getElementById('offsetVal').innerText = offset.toFixed(1) + ' 板';
      document.getElementById('bpBoardVal').innerText = bpBoard.toFixed(1) + ' 板';
      document.getElementById('bpDistVal').innerText = bpDist + ' 呎';

      const laydown = Math.max(1, Math.min(39, stanceBoard - offset));
      document.getElementById('laydownInfo').innerText = '實際落球：' + laydown.toFixed(1) + ' 板';

      const targetArrow = laydown + (15 / bpDist) * (bpBoard - laydown);
      document.getElementById('targetBoard').innerText = targetArrow.toFixed(1);

      let closestArrow = Math.round(targetArrow / 5);
      closestArrow = Math.max(1, Math.min(7, closestArrow));
      const refBoard = closestArrow * 5;
      const diff = targetArrow - refBoard;

      let desc = '第 ' + closestArrow + ' 箭頭 (' + refBoard + '板)';
      if (Math.abs(diff) >= 0.2) {
        if (currentHand === 'R') {
          desc += diff > 0 ? ' 往左 ' + Math.abs(diff).toFixed(1) + ' 板' : ' 往右 ' + Math.abs(diff).toFixed(1) + ' 板';
        } else {
          desc += diff > 0 ? ' 往右 ' + Math.abs(diff).toFixed(1) + ' 板' : ' 往左 ' + Math.abs(diff).toFixed(1) + ' 板';
        }
      } else {
        desc += ' 正中央';
      }
      document.getElementById('targetDesc').innerText = desc;

      drawSvgLane(stanceBoard, laydown, targetArrow, bpBoard, bpDist);
    }

    function drawSvgLane(stance, laydown, arrow, bp, bpDist) {
      const svg = document.getElementById('laneSvg');
      const yFoul = 178;
      const yTop = 14;
      const usableH = yFoul - yTop;
      const distToY = (d) => yFoul - (d / 48) * usableH;

      const yArrow = distToY(15);
      const yBp = distToY(bpDist);

      let html = '';

      // 繪製每 5 板的板線與底部數字
      for (let b = 5; b <= 35; b += 5) {
        const x = boardToX(b);
        const col = (b === 20) ? '#6e5436' : '#382b1c';
        const sw = (b === 20) ? 1.8 : 1;
        html += `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${yFoul}" stroke="${col}" stroke-width="${sw}" />`;
        html += `<text x="${x}" y="194" fill="#94a3b8" font-size="10" text-anchor="middle">${b}</text>`;
      }

      // 犯規線 (0 呎)
      html += `<line x1="12" y1="${yFoul}" x2="348" y2="${yFoul}" stroke="#64748b" stroke-width="1.5" />`;

      // 繪製 7 顆目標箭頭
      for (let b = 5; b <= 35; b += 5) {
        const ax = boardToX(b);
        const active = Math.abs(b - arrow) <= 2.5;
        const fill = active ? '#38bdf8' : '#64748b';
        html += `<polygon points="${ax},${yArrow - 7} ${ax - 4},${yArrow + 4} ${ax + 4},${yArrow + 4}" fill="${fill}" />`;
      }

      const xStance = boardToX(stance);
      const xLaydown = boardToX(laydown);
      const xArrow = boardToX(arrow);
      const xBp = boardToX(bp);
      const xPocket = boardToX(17.5);

      // 站點到落球點偏移虛線
      html += `<line x1="${xStance}" y1="${yFoul}" x2="${xLaydown}" y2="${yFoul}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />`;

      // 轉折點後進 Pocket (17.5板) 示意曲線
      html += `<path d="M ${xBp} ${yBp} Q ${xBp} ${yTop + 10} ${xPocket} ${yTop}" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.65" />`;

      // 主瞄準直線 (落球 -> 箭頭 -> 轉折)
      html += `<polyline points="${xLaydown},${yFoul} ${xArrow},${yArrow} ${xBp},${yBp}" fill="none" stroke="#f59e0b" stroke-width="3" />`;

      // 站點空心圈
      html += `<circle cx="${xStance}" cy="${yFoul}" r="4.5" fill="#18130d" stroke="#94a3b8" stroke-width="2" />`;

      // 節點與文字標籤
      const alignLeft = currentHand === 'R';
      function nodeHtml(x, y, color, label, toLeft) {
        const tx = toLeft ? (x - 8) : (x + 8);
        const anchor = toLeft ? 'end' : 'start';
        return `
          <circle cx="${x}" cy="${y}" r="5" fill="${color}" />
          <text x="${tx}" y="${y + 4}" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="${anchor}">${label}</text>
        `;
      }

      html += nodeHtml(xLaydown, yFoul - 4, '#10b981', `落球(${laydown.toFixed(1)})`, !alignLeft);
      html += nodeHtml(xArrow, yArrow, '#38bdf8', `瞄準(${arrow.toFixed(1)})`, alignLeft);
      html += nodeHtml(xBp, yBp, '#ef4444', `轉折(${bp.toFixed(1)})`, alignLeft);

      svg.innerHTML = html;
    }

    // 立即初始化
    render();
  </script>
</body>
</html>
