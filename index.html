<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>保齡球幾何瞄準計算器</title>

  <!-- iOS 桌面 App 專屬設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="球道瞄準">
  <meta name="theme-color" content="#0f172a">

  <!-- 桌面 App 圖示 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f172a'/%3E%3Ccircle cx='50' cy='50' r='32' fill='%23ef4444'/%3E%3Ccircle cx='42' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='58' cy='40' r='4' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='56' r='4' fill='%23ffffff'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    /* 針對 iOS 安全區域與單頁滿版配置 */
    .app-wrapper {
      width: 100%;
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 16px) + 6px) 14px calc(env(safe-area-inset-bottom, 12px) + 6px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* 頂部標題與手性切換整合，節省垂直空間 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hand-toggle {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid #334155;
    }

    .toggle-btn {
      padding: 4px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    /* 結果顯示區 */
    .result-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .laydown-badge {
      color: #10b981;
      font-weight: 600;
    }

    .target-board {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.05;
      margin: 2px 0;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .target-desc {
      font-size: 0.9rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    /* 滑桿控制區 */
    .controls {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 8px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .val-badge {
      color: var(--primary);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dir-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }

    /* 右手模式下：球道左邊是 39 板、右邊是 1 板，將滑桿反轉以符合視覺直覺 */
    input[type=range].rtl-slider {
      direction: rtl;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f8fafc;
      border: 3px solid var(--primary);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* 球道畫布區：自動填滿剩餘彈性高度 */
    .canvas-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      flex: 1;
      min-height: 120px;
      overflow: hidden;
    }

    .canvas-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .canvas-container {
      flex: 1;
      width: 100%;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: #18130d;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- 頂部列 -->
    <div class="top-bar">
      <h1>保齡球瞄準計算器</h1>
      <div class="hand-toggle">
        <button class="toggle-btn active" id="btnRight" onclick="setHand('R')">右手 (右1板)</button>
        <button class="toggle-btn" id="btnLeft" onclick="setHand('L')">左手 (左1板)</button>
      </div>
    </div>

    <!-- 結果面板 -->
    <div class="result-card">
      <div class="result-header">
        <span>目標箭頭 (15呎)</span>
        <span class="laydown-badge" id="laydownInfo">實際落球：20.0 板</span>
      </div>
      <div class="target-board" id="targetBoard">15.5</div>
      <div class="target-desc" id="targetDesc">第 3 箭頭 (15板) 往左偏 0.5 板</div>
    </div>

    <!-- 控制滑桿 -->
    <div class="controls">
      <div class="control-item">
        <div class="control-header">
          <span>滑步站點 (Stance)</span>
          <span class="val-badge" id="stanceVal">25.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="stanceLeftHint">左39</span>
          <input type="range" id="stance" class="rtl-slider" min="1" max="39" step="0.5" value="25" oninput="calculate()">
          <span class="dir-hint" id="stanceRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>落球內縮偏移 (Offset)</span>
          <span class="val-badge" id="offsetVal">5.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">0</span>
          <input type="range" id="offset" min="0" max="12" step="0.5" value="5" oninput="calculate()">
          <span class="dir-hint">12</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點板位 (Break Point)</span>
          <span class="val-badge" id="bpBoardVal">8.0 板</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint" id="bpLeftHint">左39</span>
          <input type="range" id="bpBoard" class="rtl-slider" min="1" max="39" step="0.5" value="8" oninput="calculate()">
          <span class="dir-hint" id="bpRightHint">右1</span>
        </div>
      </div>

      <div class="control-item">
        <div class="control-header">
          <span>轉折點距離 (BP Distance)</span>
          <span class="val-badge" id="bpDistVal">40 呎</span>
        </div>
        <div class="slider-wrap">
          <span class="dir-hint">35呎</span>
          <input type="range" id="bpDist" min="35" max="46" step="1" value="40" oninput="calculate()">
          <span class="dir-hint">46呎</span>
        </div>
      </div>
    </div>

    <!-- 球道視覺圖 -->
    <div class="canvas-card">
      <div class="canvas-header">
        <span id="laneLeftLabel">◀ 左側溝 (39板)</span>
        <span>球道俯視軌跡</span>
        <span id="laneRightLabel">右側溝 (1板) ▶</span>
      </div>
      <div class="canvas-container" id="canvasBox">
        <canvas id="laneCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let currentHand = 'R';

    function setHand(hand) {
      currentHand = hand;
      document.getElementById('btnRight').classList.toggle('active', hand === 'R');
      document.getElementById('btnLeft').classList.toggle('active', hand === 'L');

      const stanceSlider = document.getElementById('stance');
      const bpSlider = document.getElementById('bpBoard');

      if (hand === 'R') {
        // 右手：右邊是 1 板，左邊是 39 板
        stanceSlider.classList.add('rtl-slider');
        bpSlider.classList.add('rtl-slider');
        document.getElementById('stanceLeftHint').innerText = '左39';
        document.getElementById('stanceRightHint').innerText = '右1';
        document.getElementById('bpLeftHint').innerText = '左39';
        document.getElementById('bpRightHint').innerText = '右1';
        document.getElementById('laneLeftLabel').innerText = '◀ 左溝 (39板)';
        document.getElementById('laneRightLabel').innerText = '右溝 (1板) ▶';
      } else {
        // 左手：左邊是 1 板，右邊是 39 板
        stanceSlider.classList.remove('rtl-slider');
        bpSlider.classList.remove('rtl-slider');
        document.getElementById('stanceLeftHint').innerText = '左1';
        document.getElementById('stanceRightHint').innerText = '右39';
        document.getElementById('bpLeftHint').innerText = '左1';
        document.getElementById('bpRightHint').innerText = '右39';
        document.getElementById('laneLeftLabel').innerText = '◀ 左溝 (1板)';
        document.getElementById('laneRightLabel').innerText = '右溝 (39板) ▶';
      }
      calculate();
    }

    // 將板位轉換為 Canvas 上的 X 座標
    function boardToX(board, width) {
      const padding = 16;
      const usableW = width - padding * 2;
      if (currentHand === 'R') {
        // 右手：第 1 板在最右邊，第 39 板在最左邊
        return padding + ((39 - board) / 38) * usableW;
      } else {
        // 左手：第 1 板在最左邊，第 39 板在最右邊
        return padding + ((board - 1) / 38) * usableW;
      }
    }

    function calculate() {
      const stance = parseFloat(document.getElementById('stance').value);
      const offset = parseFloat(document.getElementById('offset').value);
      const bpBoard = parseFloat(document.getElementById('bpBoard').value);
      const bpDist = parseFloat(document.getElementById('bpDist').value);

      document.getElementById('stanceVal').innerText = stance.toFixed(1) + ' 板';
      document.getElementById('offsetVal').innerText = offset.toFixed(1) + ' 板';
      document.getElementById('bpBoardVal').innerText = bpBoard.toFixed(1) + ' 板';
      document.getElementById('bpDistVal').innerText = bpDist + ' 呎';

      // 不論左右手，球員站在球道內側，手腕落球點都會往外側溝方向偏移（板數減少）
      const laydown = Math.max(1, Math.min(39, stance - offset));
      document.getElementById('laydownInfo').innerText = `落球點：${laydown.toFixed(1)} 板`;

      // 三角相似內插計算 15 呎箭頭板位
      const arrowDist = 15;
      const targetArrowBoard = laydown + (arrowDist / bpDist) * (bpBoard - laydown);

      document.getElementById('targetBoard').innerText = targetArrowBoard.toFixed(1);

      // 計算最接近的箭頭 (5, 10, 15, 20, 25, 30, 35)
      let closestArrowNum = Math.round(targetArrowBoard / 5);
      closestArrowNum = Math.max(1, Math.min(7, closestArrowNum));
      const arrowBoardRef = closestArrowNum * 5;
      const diff = targetArrowBoard - arrowBoardRef;

      let desc = `第 ${closestArrowNum} 箭頭 (${arrowBoardRef}板)`;
      if (Math.abs(diff) >= 0.2) {
        if (currentHand === 'R') {
          // 右手：板數大 = 偏左，板數小 = 偏右
          desc += diff > 0 ? ` 往左 ${Math.abs(diff).toFixed(1)} 板` : ` 往右 ${Math.abs(diff).toFixed(1)} 板`;
        } else {
          // 左手：板數大 = 偏右，板數小 = 偏左
          desc += diff > 0 ? ` 往右 ${Math.abs(diff).toFixed(1)} 板` : ` 往左 ${Math.abs(diff).toFixed(1)} 板`;
        }
      } else {
        desc += ' 正中央';
      }
      document.getElementById('targetDesc').innerText = desc;

      drawLane(stance, laydown, targetArrowBoard, bpBoard, bpDist);
    }

    function drawLane(stance, laydown, arrow, bpBoard, bpDist) {
      const box = document.getElementById('canvasBox');
      const canvas = document.getElementById('laneCanvas');
      const dpr = window.devicePixelRatio || 1;
      const rect = box.getBoundingClientRect();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const yFoul = h - 18;
      const yTop = 14;
      const usableH = yFoul - yTop;

      // 依距離換算 Y 座標 (以 48 呎為頂部基準)
      const distToY = (d) => yFoul - (d / 48) * usableH;
      const yArrow = distToY(15);
      const yBp = distToY(bpDist
